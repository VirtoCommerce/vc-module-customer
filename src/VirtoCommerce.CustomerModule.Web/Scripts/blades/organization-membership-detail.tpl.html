<div class="blade-content">
    <div class="blade-inner">
        <div class="inner-block clearfix">
            <form name="detailForm" class="form">
                <va-metaform registered-inputs="blade.metaFields" blade="blade" column-count="1" ng-init="setForm(detailForm)"></va-metaform>
            </form>
        </div>
    </div>
</div>

<!-- Organization selector (new) / display (existing) -->
<script type="text/ng-template" id="orgMembership.organization.html">
    <div class="form-group" ng-if="!blade.isGlobal">
        <label class="form-label">{{'customer.blades.organization-membership-detail.labels.organization' | translate}}</label>
        <div class="form-input" ng-if="blade.isNew">
            <ui-scroll-drop-down
                ng-model="blade.currentEntity.organizationId"
                data="blade.fetchOrganizations(criteria)"
                value-field="id"
                display-field="name"
                required
                placeholder="'customer.blades.organization-membership-detail.placeholders.organization'">
            </ui-scroll-drop-down>
        </div>
        <div class="form-input" ng-if="!blade.isNew">
            <span>{{ blade.currentEntity.organizationName || blade.currentEntity.organizationId }}</span>
        </div>
    </div>
    <div class="form-group" ng-if="blade.isGlobal">
        <label class="form-label">{{'customer.blades.organization-membership-detail.labels.type' | translate}}</label>
        <div class="form-input">
            <span class="label label-info">{{ 'customer.blades.organization-memberships-list.type-global' | translate }}</span>
        </div>
    </div>
</script>

<!-- Roles multi-select -->
<script type="text/ng-template" id="orgMembership.roles.html">
    <div class="form-group list __info">
        <label class="form-label">
            {{'customer.blades.organization-membership-detail.labels.roles' | translate}}
            <i class="form-ico fa fa-question-circle __link __lightblue" ng-click="blade.rolesDescrVisible = !blade.rolesDescrVisible;"></i>
        </label>
        <div class="form-input">
            <ui-select multiple ng-model="blade.currentEntity.roles" required>
                <ui-select-match placeholder="{{'customer.blades.organization-membership-detail.placeholders.roles' | translate}}">
                    {{ $item.roleName || $item.name }}
                </ui-select-match>
                <ui-select-choices repeat="r in blade.availableRoles"
                                   refresh="blade.refreshRoles($select.search)"
                                   refresh-delay="200">
                    <span ng-bind-html="r.name | highlight: $select.search"></span>
                </ui-select-choices>
            </ui-select>
        </div>
        <div ng-if="blade.rolesDescrVisible">
            <div class="list-descr">{{ 'customer.blades.organization-membership-detail.hints.roles' | translate }}</div>
            <a href="" ng-click="blade.rolesDescrVisible = null;">{{ 'platform.blades.settings-detail.hide-description' | translate }}</a>
        </div>
    </div>
</script>

<!-- Organization-specific status override -->
<script type="text/ng-template" id="orgMembership.status.html">
    <div class="form-group list __info" ng-if="!blade.isNew">
        <label class="form-label">
            {{ 'customer.blades.organization-membership-detail.labels.status' | translate }}
            <i class="form-ico fa fa-question-circle __link __lightblue" ng-click="blade.statusDescrVisible = !blade.statusDescrVisible;"></i>
            <a href="" ng-click="blade.openStatusSettingManagement('Customer.OrganizationMembershipStatuses')" class="form-edit" va-permission="platform:setting:update"><i class="form-ico fa fa-pencil"></i></a>
        </label>
        <div class="form-input">
            <ui-select ng-model="blade.currentEntity.status" ng-init="blade.loadStatuses('Customer.OrganizationMembershipStatuses')" ng-change="changeStatus(blade.currentEntity.status)">
                <ui-select-match placeholder="{{ 'customer.blades.organization-membership-detail.placeholders.status-inherited' | translate }}">{{ blade.currentEntity.status }}</ui-select-match>
                <ui-select-choices repeat="x in blade.statuses | filter: $select.search">
                    <span ng-if="x" ng-bind-html="x | highlight: $select.search"></span>
                    <span ng-if="!x" class="text-muted">{{ 'customer.blades.organization-membership-detail.placeholders.status-inherited' | translate }}</span>
                </ui-select-choices>
            </ui-select>
        </div>
        <div ng-if="blade.statusDescrVisible">
            <div class="list-descr">{{ 'customer.blades.organization-membership-detail.hints.status' | translate }}</div>
            <a href="" ng-click="blade.statusDescrVisible = null;">{{ 'platform.blades.settings-detail.hide-description' | translate }}</a>
        </div>
    </div>
    <ul class="list __info">
        <li class="list-item">
            <div class="list-t">{{'customer.blades.organization-membership-detail.labels.locked-state' | translate}}</div>
            <div class="list-descr" ng-class="{alert: blade.currentEntity.isLocked}">
                {{ (blade.currentEntity.isLocked
                    ? 'customer.blades.organization-memberships-list.status-locked'
                    : 'customer.blades.organization-memberships-list.status-unlocked') | translate }}
            </div>
        </li>
    </ul>
</script>

<!-- LockoutEnd date picker (only when locked) -->
<script type="text/ng-template" id="orgMembership.lockoutEnd.html">
    <div class="form-group" ng-if="blade.currentEntity.isLocked">
        <label class="form-label">{{'customer.blades.organization-membership-detail.labels.lockout-end' | translate}}</label>
        <div class="form-input __calendar">
            <input type="text"
                   class="form-control"
                   ng-model="blade.currentEntity.lockoutEnd"
                   ng-model-options="{ timezone: 'UTC' }"
                   datepicker-popup="mediumDate"
                   enable-time="false"
                   is-open="blade.datepickers.lockoutEnd"
                   placeholder="{{'customer.blades.organization-membership-detail.placeholders.lockout-end' | translate}}" />
            <button class="btn" type="button"
                    ng-click="blade.datepickers = blade.datepickers || {}; blade.datepickers.lockoutEnd = !blade.datepickers.lockoutEnd">
                <i class="btn-ico fa fa-calendar"></i>
            </button>
        </div>
    </div>
</script>
